name: Z-Trip
description: 'Z-Trip (在途商旅) is a Shanghai-based enterprise travel and expense management
  SaaS platform (a corporate travel management company, or TMC) serving medium and large
  Chinese enterprises. It unifies booking of flights, hotels, trains, car rentals, visas,
  insurance, and MICE events with automated expense reporting, budget and policy controls,
  monthly invoicing, and up to 45 days of advance funding. The platform integrates with
  corporate OA, ERP, cost-control, and HR systems and offers single sign-on, aggregating
  supplier inventory from 200+ airlines and millions of hotels for 1,700+ enterprise clients.
  Surfaced from the dcm-ventures portfolio; no public first-party API/developer platform is
  published, though third-party integration connectors and SSO exist.'
